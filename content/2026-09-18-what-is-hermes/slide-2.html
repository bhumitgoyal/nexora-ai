<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../.claude/skills/social-content/assets/deck.css">
</head>
<body>
<!--ICONS-->

<div class="slide slide--ink">
  <div class="top">
    <div class="eyebrow">01 — Closed learning loop</div>
    <div class="page-no">02 / 04</div>
  </div>

  <h2 class="h2">It learns<br><span class="outline">on the job</span></h2>

  <div class="spacer"></div>

  <div class="rows">
    <div class="row">
      <svg class="row__ico"><use href="#i-target"/></svg>
      <div class="row__txt">Finishes the task</div>
    </div>
    <div class="row">
      <svg class="row__ico"><use href="#i-eye"/></svg>
      <div class="row__txt">Grades its own work</div>
    </div>
    <div class="row">
      <svg class="row__ico"><use href="#i-file-text"/></svg>
      <div class="row__txt">Saves a reusable skill</div>
    </div>
    <div class="row">
      <svg class="row__ico"><use href="#i-refresh-cw"/></svg>
      <div class="row__txt">Runs it better next time</div>
    </div>
  </div>

  <div style="display:flex; margin-top:40px">
    <div class="swipe swipe--inline">Swipe <svg class="ico"><use href="#i-arrow-right"/></svg></div>
  </div>
</div>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../.claude/skills/social-content/assets/deck.css">
</head>
<body>
<!--ICONS-->

<div class="slide">
  <div class="top">
    <div class="eyebrow">02 — Profiles</div>
    <div class="page-no">03 / 04</div>
  </div>

  <h2 class="h2">Not one agent.<br><span class="red">A department.</span></h2>

  <div class="spacer"></div>

  <div class="rows">
    <div class="row row--brand">
      <div class="row__no">01</div>
      <svg class="row__ico"><use href="#i-radar"/></svg>
      <div>
        <div class="row__txt">Scout</div>
        <div class="row__sub">finds the signals</div>
      </div>
    </div>
    <div class="row row--brand">
      <div class="row__no">02</div>
      <svg class="row__ico"><use href="#i-brain"/></svg>
      <div>
        <div class="row__txt">Analyst</div>
        <div class="row__sub">builds the knowledge base</div>
      </div>
    </div>
    <div class="row row--brand">
      <div class="row__no">03</div>
      <svg class="row__ico"><use href="#i-send"/></svg>
      <div>
        <div class="row__txt">Briefer</div>
        <div class="row__sub">delivers your daily brief</div>
      </div>
    </div>
  </div>

  <div style="display:flex; align-items:center; gap:20px; margin-top:44px">
    <svg class="ico" style="color:var(--brand)"><use href="#i-git-branch"/></svg>
    <div class="body"><b>Own memory. Own model. Own schedule.</b></div>
  </div>

  <div style="display:flex; margin-top:40px">
    <div class="swipe swipe--inline">Swipe <svg class="ico"><use href="#i-arrow-right"/></svg></div>
  </div>
